[package]
name = "eveningstar-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Not part of the firmware's workspace: the fuzz targets build with a nightly
# toolchain and libFuzzer, for the host only.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
eveningstar-records = { path = "../crates/eveningstar-records" }
eveningstar-signify = { path = "../crates/eveningstar-signify", features = ["test-support"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
base64 = "0.23"

[[bin]]
name = "records"
path = "fuzz_targets/records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signify"
path = "fuzz_targets/signify.rs"
test = false
doc = false
bench = false
