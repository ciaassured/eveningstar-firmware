name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The groups of `nix run .#checks`, one job each, so they run side by side.
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Rust lint
            groups: rust-lint
          - name: Web lint and tests
            groups: web-lint web-test
          - name: Build
            groups: build
            reproducible: true
          - name: Rust tests
            groups: rust-test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # The token is this step's input and nothing else's: the action keeps it
      # in the runner's Cachix configuration, not in the environment. Pull
      # requests run code nobody has reviewed yet, so they only pull and are
      # never given the token.
      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name == 'pull_request' || secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Run checks
        env:
          GROUPS_TO_RUN: ${{ matrix.groups }}
        run: |
          read -ra groups <<< "$GROUPS_TO_RUN"
          nix run .#checks -- "${groups[@]}"

      # The checks built the bundle once; building it again must give the same
      # bytes.
      - name: Check that the web UI bundle is reproducible
        if: ${{ matrix.reproducible }}
        run: |
          nix build --no-link .#web-ui-bundle
          nix build --no-link --rebuild .#web-ui-bundle

  # One result for the jobs above, under the name the checks went by before they
  # were split.
  nix-checks:
    name: Nix checks
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check job to have passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  # Checks the packages of both lockfiles against the registry's advisories and
  # signatures. It installs them, with install scripts off, in a job that has no
  # secrets.
  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Audit the lockfiles
        run: |
          audit() {
            nix shell .#nodejs --command npm --prefix "$1" ci --ignore-scripts
            nix shell .#nodejs --command npm --prefix "$1" audit --audit-level=low
            nix shell .#nodejs --command npm --prefix "$1" audit signatures
          }
          audit web
          audit tools/openapi-typescript
