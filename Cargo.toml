[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
license      = "AGPL-3.0-or-later"
publish      = false

[workspace.dependencies]
# Workspace crates.
eveningstar-api   = { path = "crates/eveningstar-api" }
eveningstar-board = { path = "crates/eveningstar-board" }

# Chip and logging features are project-wide, so they are set once here.
defmt                  = "1.0.1"
embassy-embedded-hal   = { version = "0.6.0", features = ["defmt"] }
embassy-executor       = { version = "0.10.0", features = ["defmt"] }
embassy-futures        = { version = "0.1.2", features = ["defmt"] }
embassy-time           = { version = "0.5.1", features = ["defmt"] }
embassy-sync           = { version = "0.8.0", features = ["defmt"] }
embassy-net            = { version = "0.9.1", features = ["auto-icmp-echo-reply", "defmt", "dhcpv4", "dhcpv4-hostname", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
embassy-net-wiznet     = { version = "0.3.0", features = ["defmt"] }
embedded-hal           = "1.0.0"
embedded-hal-async     = "1.0.0"
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32c6"] }
esp-hal                = { version = "~1.2.2", features = ["defmt", "esp32c6", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["defmt", "embassy", "esp32c6"] }
heapless               = "0.9.3"
picoserve              = { version = "0.20.1", features = ["defmt", "embassy", "json"] }
rtt-target             = { version = "0.6.2", features = ["defmt"] }
serde                  = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json             = "1.0.154"
static_cell            = "2.1.1"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unsafe_op_in_unsafe_fn        = "deny"
unused_qualifications         = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# mem::forget is generally not safe with esp-hal types, especially those holding
# buffers for the duration of a data transfer.
mem_forget = "deny"
# Threshold is `stack-size-threshold` in `.clippy.toml`.
large_stack_frames = "deny"

# no_std hygiene.
alloc_instead_of_core = "warn"
std_instead_of_alloc  = "warn"
std_instead_of_core   = "warn"

# Modules live in `foo.rs` next to a `foo/` directory, not in `foo/mod.rs`.
mod_module_files = "warn"

# Leftovers and unsafe documentation.
dbg_macro                   = "warn"
todo                        = "warn"
undocumented_unsafe_blocks  = "warn"
unimplemented               = "warn"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1      # LLVM can perform better optimizations using a single thread
debug         = 2      # prefer slower builds but better debugging experience
lto           = "fat"
opt-level     = "s"
